# The whole custody stack for one builder, on one machine: Postgres, dpm-wallet,
# dpm-wallet-manager, and the setup service that configures them.
#
# Nobody edits this file. The installer (install.sh / install.ps1) writes .env next to it with
# the database password and the image versions; everything else is produced by setup, which
# writes each service's env file into that service's own volume (`config-wallet`, `config-manager`).
# Until it has, both services wait: their command below loops until /config/ready exists.
#
# Who can read what. Three volumes, each mounted only where it is needed: `config-wallet` by
# dpm-wallet and setup, `config-manager` by the manager and setup, `setup-state` (answers, secrets,
# journal) by setup alone. So the manager cannot read the wallet's env file, and neither service can
# read setup's state. Env files are mode 0600. All three containers run as uid 100 (the user each
# image creates), so 0600 lets the service that owns the volume read its file; no volume is shared
# between two services, which is why distinct uids add nothing. The services pin `user:` so a
# change of image user fails loudly (a permission error at boot) rather than silently.
# `config` is the single volume older versions used. Setup mounts it read-only and copies it across
# when it starts; it is kept so a rollback still works, until `./dpm-custody cleanup-legacy`.
# Migration is part of setup's start (not a separate one-shot service) because an upgrade is run by
# the *old* dpm-custody, which requires every service in the new compose.yml to be running.
#
# Hardening. Every app service drops all Linux capabilities and cannot gain privileges, and runs
# with a read-only root filesystem (a tmpfs for /tmp; the volumes are the only writable places).
# Postgres keeps only the few capabilities its entrypoint needs to hand the data directory to its
# own user and drop to it. Networks: `backend` is internal (no route out, none in) and holds
# Postgres with the three services that use it, so the database can neither be reached nor reach
# anything from outside; the services that must talk to the world (dpm-wallet to Turnkey and the
# platform, setup to the platform, the manager for its published port) are also on `default`.
# The `tools` helper has no network at all.
#
# Setup has no port: it is driven from a terminal with `./dpm-custody setup`, which runs inside
# its container. The only port published is the wallet manager's API (3000), on loopback unless
# MANAGER_BIND says otherwise. dpm-wallet and Postgres are reachable only inside this stack.

name: dpm-custody

x-platform-host: &platform-host
  # A platform running on this same computer (the "Local" environment) is reached here.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-readonly: &readonly
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

# Every service keeps at most 5 container log files of 20 MB (100 MB per service), so a long-running
# install cannot fill the disk with logs.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# Used by the two app services. The images have no curl, so the probe is a one-line node fetch.
# start_period gives migrations time; until setup writes /config/ready the app is not running
# yet, so it shows `starting` and then `unhealthy` until setup finishes. For that reason the manager
# depends on dpm-wallet only being started, not healthy: on a fresh install dpm-wallet stays
# unhealthy until setup runs, and waiting for it would stop `docker compose up -d` and the installer.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 60s

services:
  postgres:
    <<: *logging
    # Debian (glibc) rather than Alpine (musl): musl has no real locale support, so text indexes
    # sort by code point there and by the locale's rules here. The reference is pinned by digest;
    # .env carries POSTGRES_TAG (written by the installer, moved by an upgrade) and this default
    # applies to an install whose .env predates it. Moving an Alpine install onto this image needs
    # its text indexes rebuilt: `setup migrate` does that once (src/setup/collation.ts).
    image: postgres:${POSTGRES_TAG:-18-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6}
    restart: unless-stopped
    # The entrypoint starts as root to own the data directory (chown, also for a directory an
    # Alpine image created as uid 70) and then switches to the postgres user: it needs exactly these.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # Not read_only: Compose cannot place the init script below (a `configs` entry) into a
    # read-only container, and Postgres writes its socket and logs-in-progress under /var/run.
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Re-run the installer.}
      POSTGRES_DB: dpm_wallet
    configs:
      - source: create-manager-database
        target: /docker-entrypoint-initdb.d/10-create-manager-database.sql
        # Postgres runs init scripts as its own user; Compose mounts config content root-only.
        mode: 0444
    volumes:
      # Postgres 18 keeps its data under a versioned subdirectory, so the parent is mounted.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpm} -d dpm_wallet"]
      interval: 5s
      timeout: 5s
      retries: 20

  dpm-wallet:
    <<: [*platform-host, *logging, *hardening, *readonly]
    networks: [backend, default]
    image: ${DPM_IMAGE_REGISTRY:-ghcr.io/in-a-bit}/dpm-wallet:${DPM_WALLET_TAG:?DPM_WALLET_TAG is not set in .env. Re-run the installer.}
    restart: unless-stopped
    # Wait for setup's configuration, load it, then do what the image always does:
    # migrate, then start. The file's values are single-quoted, which `.` reads verbatim.
    command:
      - sh
      - -c
      - |
        until [ -f /config/ready ]; do sleep 2; done
        set -a; . /config/dpm-wallet.env; set +a
        node dist/db/migrate-cli && exec node dist/main
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    user: "100:101"
    volumes:
      - config-wallet:/config:ro
      # The wallet's data directory (no key material is written here); `dpm-custody backup` still copies it.
      - wallet-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      # Setup has migrated the volumes (and so created them with the right owner) by then.
      setup:
        condition: service_healthy
    stop_grace_period: 30s

  dpm-wallet-manager:
    <<: [*platform-host, *logging, *hardening, *readonly]
    networks: [backend, default]
    image: ${DPM_IMAGE_REGISTRY:-ghcr.io/in-a-bit}/dpm-wallet-manager:${DPM_WALLET_MANAGER_TAG:?DPM_WALLET_MANAGER_TAG is not set in .env. Re-run the installer.}
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        until [ -f /config/ready ]; do sleep 2; done
        set -a; . /config/dpm-wallet-manager.env; set +a
        node dist/db/migrate-cli && exec node dist/main
    ports:
      # Set MANAGER_BIND=0.0.0.0 in .env when the builder's backend runs on another machine.
      - "${MANAGER_BIND:-127.0.0.1}:${MANAGER_PORT:-3000}:3000"
    environment:
      # Empty means "use the built-in default" (90 days, 365 days, enabled). Set in .env.
      OPERATIONS_RETENTION_DAYS: ${OPERATIONS_RETENTION_DAYS:-}
      ROUTED_ORDER_RETENTION_DAYS: ${ROUTED_ORDER_RETENTION_DAYS:-}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-}
      # Names this install in storage alerts. Empty means "install". Must be http(s) when set.
      # An https:// address also turns the admin dashboard's session cookie Secure.
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-}
      # true or false overrides that either way, e.g. for TLS that ends somewhere the URL does
      # not show. Empty means "follow MANAGER_PUBLIC_URL".
      UI_COOKIE_SECURE: ${UI_COOKIE_SECURE:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    user: "100:101"
    volumes:
      - config-manager:/config:ro
      # Read-only, and used only to ask the disk how full it is (statfs); no file is read.
      - pg-data:/storage/pg:ro
    depends_on:
      postgres:
        condition: service_healthy
      dpm-wallet:
        condition: service_started
      setup:
        condition: service_healthy
    stop_grace_period: 30s

  # Runs provisioning in the background once `./dpm-custody setup` has recorded the answers, so a
  # closed terminal never stops a setup half-way. The terminal app runs in here too (exec).
  setup:
    <<: [*platform-host, *logging, *hardening, *readonly]
    networks: [backend, default]
    image: ${DPM_IMAGE_REGISTRY:-ghcr.io/in-a-bit}/dpm-wallet-manager:${DPM_WALLET_MANAGER_TAG:?DPM_WALLET_MANAGER_TAG is not set in .env. Re-run the installer.}
    restart: unless-stopped
    # Migrate the volumes (idempotent; see src/setup/migrate.ts), mark it done, then run the worker.
    # The marker is cleared first, so "healthy" always means this start has migrated.
    command:
      - sh
      - -c
      - |
        rm -f /state/.migrated
        if node dist/setup/main migrate; then
          : > /state/.migrated
        else
          # Stay up but unhealthy: `up -d` then fails at once and an upgrade rolls back, instead
          # of a restart loop.
          echo "setup: the volume migration failed (see above)" >&2
          while :; do sleep 3600; done
        fi
        exec node dist/setup/main
    healthcheck:
      test: ["CMD", "test", "-f", "/state/.migrated"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    user: "100:101"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SETUP_MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - config-wallet:/config-wallet
      - config-manager:/config-manager
      - setup-state:/state
      # The single volume of earlier versions, read-only: migrate copies from it. Only
      # `dpm-custody cleanup-legacy` mounts it writable, to empty it.
      - config:/legacy-config:ro
    depends_on:
      # Migration may have to create the services' database roles (an install from before them),
      # and setup creates them for a new one: it is the only service that holds the superuser
      # password. dpm-wallet and the manager get roles that own their own database and nothing else.
      postgres:
        condition: service_healthy

  # One-off helpers for secrets and decrypted backups: `dpm-custody backup-open` and `backup-key`
  # run commands here with `compose run`. It has no log driver, so nothing it prints (a decrypted
  # dump, a new recovery key) is kept in Docker's container logs, and it gets no volumes and no
  # environment. A profile keeps `up` and `compose config --services` from ever seeing it, so the
  # upgrade health gate ignores it.
  tools:
    profiles: ["tools"]
    <<: *hardening
    read_only: true
    network_mode: none
    image: ${DPM_IMAGE_REGISTRY:-ghcr.io/in-a-bit}/dpm-wallet-manager:${DPM_WALLET_MANAGER_TAG:?DPM_WALLET_MANAGER_TAG is not set in .env. Re-run the installer.}
    restart: "no"
    command: ["true"]
    user: "100:101"
    logging:
      driver: none

  # Reads the services' env files for `dpm-custody support`, to know which values to mask. Same
  # isolation as `tools` (profile only, no network, no log driver, read-only), plus a read-only view
  # of the two configuration volumes; it runs with `compose run`, so it works with the stack stopped.
  config-reader:
    profiles: ["tools"]
    <<: *hardening
    image: ${DPM_IMAGE_REGISTRY:-ghcr.io/in-a-bit}/dpm-wallet-manager:${DPM_WALLET_MANAGER_TAG:?DPM_WALLET_MANAGER_TAG is not set in .env. Re-run the installer.}
    restart: "no"
    command: ["true"]
    user: "100:101"
    read_only: true
    network_mode: none
    logging:
      driver: none
    volumes:
      - config-wallet:/config-wallet:ro
      - config-manager:/config-manager:ro

configs:
  create-manager-database:
    content: |
      CREATE DATABASE dpm_wallet_manager;

networks:
  backend:
    internal: true

volumes:
  pg-data:
  wallet-data:
  config-wallet:
  config-manager:
  setup-state:
  # Legacy: the single volume of versions before the split. See the header.
  config:
