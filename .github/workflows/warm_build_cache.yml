name: Warm Build Cache

# Staggered off prediction-go's 0 19 / 0 3, and off the other three custody
# repos, so five repos do not hit one BuildKit at the same instant.
on:
  schedule:
    - cron: '40 19 * * *'   # 22:40 Israel time
    - cron: '40 3 * * *'    # 06:40 Israel time
  workflow_dispatch:

env:
  REPO: europe-west1-docker.pkg.dev/inabit-mgmt/dpm-eu
  IMAGE_NAME: dpm-wallet-manager

jobs:
  warm-cache:
    runs-on: fast-gke

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CI_SA_KEY }}

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkit-cache.github-actions.svc.cluster.local:1234

      # Warms two things: the image layer cache, and the npm cache the Dockerfile
      # mounts at /root/.npm — which is where a cold build spends its time.
      - name: Build and push main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REPO }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
