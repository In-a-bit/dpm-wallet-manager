name: Build and Push Image

on:
  push:
    branches: ["main", "dev", "release/**"]
  pull_request:
  workflow_dispatch:

env:
  REPO: europe-west1-docker.pkg.dev/inabit-mgmt/dpm-eu
  IMAGE_NAME: dpm-wallet-manager

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'NOBUILD') }}
    runs-on: fast-gke

    steps:
      - name: Determine branch name
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "BRANCH_NAME=$(echo "$BRANCH" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CI_SA_KEY }}

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkit-cache.github-actions.svc.cluster.local:1234

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ env.BRANCH_NAME }}
            ${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
