name: Build and Publish Image

# Publishes the public image to GHCR from GitHub-hosted runners. This repo is public:
# anyone can open a PR, so nothing here may run on the self-hosted fast-gke runner,
# and a PR build never logs in or pushes.
#
# Tags:
#   push to dev / stage / main   → :<branch>, :sha-<short>
#   git tag v1.2.3               → :1.2.3, :1.2, :latest, :sha-<short>
#   pull request                 → built only, nothing pushed

on:
  push:
    branches: ["main", "stage", "dev", "release/**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/in-a-bit/dpm-wallet-manager

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'NOBUILD') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a v* tag, publish the one-step install files as release assets, so
  # install.sh (…/releases/latest/download/…) always fetches a matching set.
  # versions.env is pinned to the image this tag just published.
  release-install-files:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin the manager image to this release
        env:
          VERSION: ${{ github.ref_name }}
        run: sed -i "s/^DPM_WALLET_MANAGER_TAG=.*/DPM_WALLET_MANAGER_TAG=${VERSION#v}/" deploy/versions.env

      - name: Attach install files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/install.sh
            deploy/install.ps1
            deploy/compose.yml
            deploy/versions.env
            deploy/dpm-custody
