name: Build and Publish Image

# Publishes the public image to GHCR from GitHub-hosted runners. This repo is public:
# anyone can open a PR, so nothing here may run on the self-hosted fast-gke runner,
# and a PR build never logs in or pushes.
#
# Tags:
#   push to dev / stage / main   → :<branch>, :sha-<short>
#   git tag v1.2.3               → :1.2.3, :1.2, :latest, :sha-<short>
#   pull request                 → built only, nothing pushed

on:
  push:
    branches: ["main", "stage", "dev", "release/**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/in-a-bit/dpm-wallet-manager

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'NOBUILD') }}
    runs-on: ubuntu-latest
    # The one job that pushes an image. A pull request never does (and never gets a write token
    # from a fork anyway); a manual run publishes only from the branches and tags released from.
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: >-
        ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (
        github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage' ||
        github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/tags/v'))) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a v* tag, publish the one-step install files as release assets, so
  # install.sh (…/releases/latest/download/…) always fetches a matching set.
  # versions.env is pinned to the image this tag just published.
  release-install-files:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # RELEASE_SIGNING_KEY lives only in the "release" environment, which admits v* tags
    # and waits for a reviewer, so no other branch or job can sign an installer.
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # versions.env names the dpm-wallet release this one was tested with. If that image
      # was never published, every install of this release would fail while pulling it,
      # so refuse to publish the release instead.
      - name: Check the pinned dpm-wallet image exists
        run: |
          WALLET_TAG="$(sed -n 's/^DPM_WALLET_TAG=//p' deploy/versions.env)"
          docker manifest inspect "ghcr.io/in-a-bit/dpm-wallet:${WALLET_TAG}" > /dev/null || {
            echo "::error::ghcr.io/in-a-bit/dpm-wallet:${WALLET_TAG} is not published. Release dpm-wallet first, or fix DPM_WALLET_TAG in deploy/versions.env."
            exit 1
          }

      # Pin both images by digest as <version>@sha256:<digest>, so an install gets exactly the
      # images this release was tested with even if a tag is later moved.
      - name: Pin the images to this release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          WALLET_TAG="$(sed -n 's/^DPM_WALLET_TAG=//p' deploy/versions.env)"
          MANAGER_TAG="${VERSION#v}"
          WALLET_DIGEST="$(docker buildx imagetools inspect "ghcr.io/in-a-bit/dpm-wallet:${WALLET_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          MANAGER_DIGEST="$(docker buildx imagetools inspect "ghcr.io/in-a-bit/dpm-wallet-manager:${MANAGER_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ -z "$WALLET_DIGEST" ] || [ -z "$MANAGER_DIGEST" ]; then
            echo "::error::Could not resolve an image digest (wallet='${WALLET_DIGEST}', manager='${MANAGER_DIGEST}')."
            exit 1
          fi
          # Postgres is pinned by digest too: resolved now, written to versions.env and to the default
          # in compose.yml (which serves installs whose .env predates POSTGRES_TAG), so the two agree.
          PG_BASE="$(sed -n 's/^POSTGRES_TAG=//p' deploy/versions.env | sed 's/@.*//')"
          if ! printf '%s' "$PG_BASE" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::POSTGRES_TAG in deploy/versions.env has an unusable tag ('${PG_BASE}')."
            exit 1
          fi
          PG_DIGEST="$(docker buildx imagetools inspect "postgres:${PG_BASE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if ! printf '%s' "$PG_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "::error::Could not resolve the digest of postgres:${PG_BASE} (got '${PG_DIGEST}')."
            exit 1
          fi
          sed -i "s|^POSTGRES_TAG=.*|POSTGRES_TAG=${PG_BASE}@${PG_DIGEST}|" deploy/versions.env
          sed -i "s|image: postgres:\${POSTGRES_TAG:-[^}]*}|image: postgres:\${POSTGRES_TAG:-${PG_BASE}@${PG_DIGEST}}|" deploy/compose.yml
          grep -qF "image: postgres:\${POSTGRES_TAG:-${PG_BASE}@${PG_DIGEST}}" deploy/compose.yml
          sed -i "s|^DPM_WALLET_TAG=.*|DPM_WALLET_TAG=${WALLET_TAG}@${WALLET_DIGEST}|" deploy/versions.env
          sed -i "s|^DPM_WALLET_MANAGER_TAG=.*|DPM_WALLET_MANAGER_TAG=${MANAGER_TAG}@${MANAGER_DIGEST}|" deploy/versions.env
          sed -i "s|^RELEASE_VERSION=.*|RELEASE_VERSION=${MANAGER_TAG}|" deploy/versions.env
          cat deploy/versions.env

      - name: Checksum the install files
        run: |
          set -eu
          cd deploy
          sha256sum install.sh install.ps1 compose.yml versions.env dpm-custody > SHA256SUMS
          cat SHA256SUMS

      # Signs SHA256SUMS (ECDSA P-256, DER) so install.sh, install.ps1 and dpm-custody can tell this
      # release from a tampered one. The private key is a repository secret; see
      # scripts/release-signing-key.sh. The signature is checked here against the public key
      # embedded in the installers, so a wrong key or a placeholder fails the release instead of
      # shipping one nobody can install.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set. Create the key with scripts/release-signing-key.sh."
            exit 1
          fi
          # The three installers each embed the public key; a release where they disagree would
          # verify for some and not others, so refuse to sign one.
          embedded() {
            awk '/-----BEGIN PUBLIC KEY-----/{f=1} f{print} /-----END PUBLIC KEY-----/{exit}' "$1" \
              | sed "s/^RELEASE_PUBKEY='//; s/'\$//"
          }
          embedded deploy/install.sh > "$RUNNER_TEMP/release.pub"
          for f in deploy/dpm-custody deploy/install.ps1; do
            embedded "$f" | cmp -s - "$RUNNER_TEMP/release.pub" \
              || { echo "::error::The public key embedded in $f differs from the one in deploy/install.sh."; exit 1; }
          done
          grep -q 'BEGIN PUBLIC KEY' "$RUNNER_TEMP/release.pub" \
            || { echo "::error::No embedded release public key found in deploy/install.sh."; exit 1; }
          umask 077
          KEY="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          openssl dgst -sha256 -sign "$KEY" -out deploy/SHA256SUMS.sig deploy/SHA256SUMS
          openssl dgst -sha256 -verify "$RUNNER_TEMP/release.pub" -signature deploy/SHA256SUMS.sig deploy/SHA256SUMS \
            || { echo "::error::The signature does not verify against the public key embedded in deploy/install.sh. Is the embedded key the one for RELEASE_SIGNING_KEY?"; exit 1; }

      - name: Attach install files to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            deploy/install.sh
            deploy/install.ps1
            deploy/compose.yml
            deploy/versions.env
            deploy/dpm-custody
            deploy/SHA256SUMS
            deploy/SHA256SUMS.sig
