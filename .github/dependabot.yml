version: 2
updates:
  # Actions are pinned to commit SHAs with a "# vX" comment; this keeps the pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Dockerfile base image (pinned by digest).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
